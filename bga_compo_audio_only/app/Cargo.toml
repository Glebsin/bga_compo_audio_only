dev-dependencies = { trycmd = "1" }
[package]
name = "bga_compo_audio_only"
version = "0.1.0"
edition = "2024"
publish = false
description = "`BGA_compo_audio_only` in Rust, lifted by rust-anything from its front door"

[[bin]]
name = "bga_compo_audio_only"
path = "src/main.rs"

[dependencies]
bms-audio = { path = "../bms-audio" }
mimalloc = "0.1"

# Fat LTO + one codegen unit speed the hot loop up; strip drops symbol tables;
# abort drops unwinding machinery.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
