[package]
name = "bmflat"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of bmflat.c (BMS chart parser), byte-faithful to the C original"

[lib]
name = "bmflat"
path = "src/lib.rs"

[[bench]]
name = "parse"
harness = false

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace]
